<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora IMC</title>

<link rel="stylesheet" href="style.css">
<script src="script.js"></script>

</head>

<body>

<div class="container">

<header>Calculadora IMC</header>

<ul>

<li>
<h5>Informe o seu peso (kg) :</h5>
<input type="number" name="txtpeso" id="txtpeso">
</li>

<li>
<h5>Informe a sua altura (m) :</h5>
<input type="number" name="txtaltura" id="txtaltura">
</li>

<li>
<button onclick="classificacaoIMC()">Calcular</button>
</li>

<li>
<h5>IMC</h5>
<input type="number" name="txtimc" id="txtimc">
</li>

<li>
<h5>Classificação IMC</h5>
<input type="text" name="txtclassificacao" id="txtclassificacao">
</li>

</ul>

<footer>
Desenvolvido por Rafaella Ferreira
</footer>

</div>

</body>
</html>
