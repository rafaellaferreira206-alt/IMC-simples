<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora IMC</title>

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>

</head>

<body>

<div class="container">

<header>
<div class="icone">⚖️</div>
<h1>Calculadora IMC</h1>
<p>Calcule seu índice de massa corporal</p>
</header>

<ul>

<li>
<h5>Informe o seu peso (kg)</h5>
<input type="number" id="txtpeso">
</li>

<li>
<h5>Informe a sua altura (m)</h5>
<input type="number" id="txtaltura">
</li>

<li>
<button onclick="classificacaoIMC()">Calcular</button>
</li>

</ul>

<hr>

<ul class="resultados">

<li>
<h5>IMC</h5>
<input type="text" id="txtimc">
</li>

<li>
<h5>Classificação</h5>
<input type="text" id="txtclassificacao">
</li>

</ul>

<footer>
Desenvolvido por Rafaella Ferreira
</footer>

</div>

</body>
</html>
